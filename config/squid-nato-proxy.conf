# Managed Squid forward-proxy configuration for the NATO VPN path.
#
# The proxy listens only on this host's Tailscale address. Only the three
# explicitly listed Tailscale clients may connect, and they may request only
# the NATO destination at 172.16.0.15 on HTTP or HTTPS ports.

http_port 100.87.23.102:3128

acl authorised_clients src 100.70.250.58/32
acl authorised_clients src 100.112.27.31/32
acl authorised_clients src 100.115.187.97/32

acl nato_target dst 172.16.0.15/32

acl Safe_ports port 80
acl Safe_ports port 443
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow authorised_clients nato_target
http_access deny all

cache deny all

access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log

visible_hostname nato-proxy
